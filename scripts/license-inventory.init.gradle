// Export resolved release components and binary paths for the reviewed notice generator.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('exportReleaseLicenseInventory') {
        doLast {
            def configuration = app.configurations.getByName('releaseRuntimeClasspath')
            def components = configuration.incoming.resolutionResult.allComponents
                .collect { it.id }.findAll { it instanceof ModuleComponentIdentifier }
                .collect { "${it.group}:${it.module}:${it.version}" }.sort()
            def artifacts = configuration.incoming.artifactView {
                componentFilter { it instanceof ModuleComponentIdentifier }
            }.artifacts.artifacts.collect {
                [component: it.id.componentIdentifier.toString(), path: it.file.absolutePath]
            }.sort { it.component + it.path }
            def output = app.layout.buildDirectory.file('reports/notices/resolved.json').get().asFile
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([components: components, artifacts: artifacts])) + '\n'
        }
    }
}
